<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planeja Lar</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- jsPDF for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Home Landing Page (pre-auth) -->
<div id="home-root" style="display:none;min-height:100vh;width:100%;position:relative"></div>

<!-- Auth / Select Profile root (full-page, outside layout) -->
<div id="auth-root" style="display:none;min-height:100vh;width:100%;position:relative"></div>

<!-- Main App Layout -->
<div id="layout" style="display:none;width:100%">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo" onclick="Router.go('dashboard')" style="cursor: pointer">
      <img src="assets/logo.png" alt="Planeja Lar" onerror="this.style.display='none'">
      <div class="sidebar-logo-text">
        Planeja Lar
        <small>Finanças da família</small>
      </div>
    </div>
    <div class="sidebar-member" id="sidebar-member"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="tip-box" id="sidebar-tip"></div>
    <div class="sidebar-footer" style="display:flex; flex-direction:column; gap:0.5rem; align-items:stretch; width:100%; padding:0.75rem 1rem;">
      <div style="display:flex; justify-content:space-between; align-items:center; width:100%">
        <span style="font-size:.75rem;color:var(--muted-foreground)">v1.0 — offline</span>
      </div>
      <div style="display:flex; gap:0.4rem; width:100%">
        <button class="btn btn-sm btn-outline" onclick="exportData()" style="flex:1; justify-content:center; font-size:0.75rem; padding:0.25rem 0.4rem;">Exportar</button>
        <button class="btn btn-sm btn-outline" onclick="triggerImport()" style="flex:1; justify-content:center; font-size:0.75rem; padding:0.25rem 0.4rem;">Importar</button>
      </div>
      <input type="file" id="import-file" style="display:none" onchange="importData(this)" accept=".json">
    </div>
  </aside>

  <!-- Main content -->
  <div class="main-wrap">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-row">
        <button class="btn-icon" id="btn-hamburger" style="display:none" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="topbar-month-wrap">
          <span class="month-selector-label">Selecionar mês e ano</span>
          <div class="month-selector">
            <button id="btn-prev-month" title="Mês anterior">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="month-label" id="month-label"></span>
            <button id="btn-next-month" title="Próximo mês">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
          </div>
          <span class="month-sub" id="month-sub"></span>
        </div>

        <div class="topbar-actions">
          <button class="btn-icon" id="btn-search" title="Buscar transações (Ctrl+K)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          
          <div class="notification-wrap" style="position:relative">
            <button class="btn-icon" id="btn-notifications" title="Notificações" style="position:relative;">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span id="notification-badge" style="display:none; position:absolute; top:-4px; right:-4px; background:var(--destructive); color:#fff; font-size:0.65rem; font-weight:700; width:16px; height:16px; border-radius:50%; align-items:center; justify-content:center;">0</span>
            </button>
            <div id="notification-dropdown" class="card" style="display:none; position:absolute; top:calc(100% + 8px); right:0; width:280px; max-height:360px; overflow-y:auto; z-index:1000; box-shadow:var(--shadow-lg); border-color:var(--border);">
              <div style="padding:0.75rem 1rem; border-bottom:1px solid var(--border); font-weight:600; font-size:0.85rem; display:flex; justify-content:space-between; align-items:center;">
                <span>Notificações</span>
              </div>
              <div id="notification-list" style="display:flex; flex-direction:column;"></div>
            </div>
          </div>
          
          <button class="btn-icon" id="btn-theme" title="Alternar tema"></button>
          <button class="btn-icon" id="btn-logout" title="Sair">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="page-content" id="page-content"></main>
  </div>
  
  <!-- Floating Action Button (FAB) -->
  <div id="fab-container" style="position:fixed; bottom:1.5rem; right:1.5rem; z-index:999; display:flex; flex-direction:column; align-items:flex-end; gap:0.5rem;">
    <!-- Small menu buttons -->
    <div id="fab-menu" style="display:none; flex-direction:column; gap:0.5rem; margin-bottom:0.5rem; align-items:flex-end;">
      <button class="btn btn-primary btn-sm" onclick="fabAction('income')" style="box-shadow:var(--shadow-md); border-radius:50px; white-space:nowrap; padding: 0.5rem 1rem;">+ Receita</button>
      <button class="btn btn-primary btn-sm" onclick="fabAction('expense')" style="box-shadow:var(--shadow-md); border-radius:50px; white-space:nowrap; padding: 0.5rem 1rem;">+ Despesa</button>
    </div>
    <!-- Main FAB button -->
    <button id="main-fab" class="btn" style="width:50px; height:50px; border-radius:50%; background:var(--gradient-primary); box-shadow:var(--shadow-glow); color:#fff; display:flex; align-items:center; justify-content:center; padding:0; border:none; transition:transform 0.2s ease;">
      <svg id="main-fab-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" style="transition:transform 0.2s ease;"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
</div>

<!-- Scripts — order matters -->
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/router.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/auth.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/incomes.js"></script>
<script src="js/pages/expenses.js"></script>
<script src="js/pages/other-pages.js"></script>
<script src="js/app.js"></script>

</body>
</html>
